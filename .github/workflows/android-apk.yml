name: Build Android APK (free)

# Manual or main push. Builds Capacitor DEBUG APK and publishes to Releases
# so phone can download Bharat-AI-debug.apk without Actions artifact ZIP.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and build web app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Add Capacitor (not saved to package.json)
        run: npm install --no-save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Android project and sync web build
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: bharat-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Bharat-AI-debug.apk
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Bharat-AI-debug.apk --clobber
          else
            gh release create latest-apk Bharat-AI-debug.apk \
              --target "${{ github.sha }}" \
              --title "Bharat-AI Android Debug APK" \
              --notes "Direct APK download (no ZIP). Cleartext/LAN Comfy needs https tunnel or cleartext=true."
          fi
