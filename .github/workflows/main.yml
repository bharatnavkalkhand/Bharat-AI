#!/bin/bash

# Bharat AI Cinematic Studio - Automated Setup Script
# This script generates the complete project structure

set -e

PROJECT_NAME="bharat-ai-cinematic-studio"
ROOT_DIR="$PWD/$PROJECT_NAME"

echo "🚀 Creating Bharat AI Cinematic Studio project..."
echo "📁 Project directory: $ROOT_DIR"

# Create directory structure
mkdir -p "$ROOT_DIR/app/login"
mkdir -p "$ROOT_DIR/app/signup"
mkdir -p "$ROOT_DIR/app/dashboard"
mkdir -p "$ROOT_DIR/app/projects/[projectId]/script"
mkdir -p "$ROOT_DIR/app/projects/[projectId]/scenes"
mkdir -p "$ROOT_DIR/app/projects/[projectId]/characters"
mkdir -p "$ROOT_DIR/app/projects/[projectId]/voices"
mkdir -p "$ROOT_DIR/app/projects/[projectId]/render"
mkdir -p "$ROOT_DIR/app/projects/[projectId]/review"
mkdir -p "$ROOT_DIR/server/routes"
mkdir -p "$ROOT_DIR/prisma"

echo "✅ Directories created"

# Root level files
echo "📝 Creating root configuration files..."

cat > "$ROOT_DIR/README.md" <<'EOF'
# Bharat AI Cinematic Studio

A zero-credit AI cinematic video generation
